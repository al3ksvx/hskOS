<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HotelOS</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0e1116">
<link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon.svg"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0e1116;--card:#171c24;--line:#262d38;--tx:#e8eaed;--mu:#8b95a5;--ac:#d4a95a;--clean:#3ecf8e;--dirty:#f5a623;--occupied:#5b8def;--maintenance:#ef5350;--inspection:#b388ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#0e1116;border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
button{background:var(--ac);color:#17130a;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--line)}button.d{background:var(--maintenance);color:#fff}
#app{display:flex;min-height:100vh}nav{width:220px;background:var(--card);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav .logo{font-weight:700;font-size:18px;padding:4px 10px 14px;color:var(--ac)}nav .logo small{display:block;color:var(--mu);font-weight:400;font-size:11px}
nav a{padding:10px 12px;border-radius:8px;color:var(--mu);cursor:pointer;display:flex;justify-content:space-between}nav a.on,nav a:hover{background:#1f2631;color:var(--tx)}
main{flex:1;padding:22px;max-width:1100px;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
h2{margin:0 0 16px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.big{font-size:30px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#0e1116}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.row>*{flex:1;min-width:120px}.row>button{flex:0}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--mu);font-weight:500}
.bar{height:10px;background:#0e1116;border-radius:9px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
#chat{height:60vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:10px}.m{max-width:80%;background:#1f2631;padding:7px 11px;border-radius:12px}.m.me{align-self:flex-end;background:#3a3017}.m.s{align-self:center;background:none;color:var(--mu);font-size:12px}
.login{max-width:360px;margin:8vh auto;padding:20px}.login .card{display:grid;gap:10px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222a36;padding:10px 16px;border-radius:10px;display:none;z-index:9}
@media(max-width:760px){#app{flex-direction:column-reverse}nav{width:100%;height:auto;position:fixed;bottom:0;left:0;right:0;flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5;border-top:1px solid var(--line);border-right:0}
nav .logo{display:none}nav a{white-space:nowrap;padding:8px 10px}main{padding:14px 14px 80px}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),E=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let T={},S={token:localStorage.tk||null,user:null,hotel:'',rooms:[],bookings:[],tasks:[],msgs:[],users:[],view:'dashboard',filter:'all'},ws,lang=localStorage.lang||'pl';
const t=(k,p)=>(T[k]??k).replace(/\{(\w+)\}/g,(_,x)=>p?.[x]??'');
const SC={clean:'--clean',dirty:'--dirty',occupied:'--occupied',maintenance:'--maintenance',inspection:'--inspection'};
const pill=s=>`<span class="pill" style="background:var(${SC[s]})">${t('status.'+s)}</span>`;
const fmtD=d=>new Date(d).toLocaleDateString(T.locale),fmtT=d=>new Date(d).toLocaleTimeString(T.locale,{hour:'2-digit',minute:'2-digit'});
const money=n=>new Intl.NumberFormat(T.locale,{style:'currency',currency:T.currency}).format(n||0);
const toast=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2500)};
async function api(m,u,b){const r=await fetch('/api'+u,{method:m,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&S.token&&j.error==='auth'){logout();}const e=new Error(t('err.'+(j.error||'generic')));throw e}return j}
const run=async f=>{try{await f()}catch(e){toast(e.message)}};
async function loadLang(l){lang=l;localStorage.lang=l;T=await (await fetch('/i18n/'+l+'.json')).json();document.documentElement.lang=T.lang==='ua'?'uk':'pl';document.title='HotelOS'}
async function setLang(l){await loadLang(l);if(S.user){run(()=>api('PUT','/me',{lang:l}));}render()}
const LS=()=>`<select onchange="setLang(this.value)" aria-label="${t('language')}"><option value="pl" ${lang==='pl'?'selected':''}>Polski</option><option value="ua" ${lang==='ua'?'selected':''}>Українська</option></select>`;
function logout(){localStorage.removeItem('tk');S.token=null;S.user=null;ws&&ws.close();render()}
async function boot(){await loadLang(lang);const st=await (await fetch('/api/setup')).json();
 if(S.token){try{await loadMe();await loadAll();connect();render();return}catch{S.token=null}}
 render(st.needsSetup?'setup':'login')}
async function loadMe(){const j=await api('GET','/me');S.user=j.user;S.hotel=j.hotel;if(j.user.lang!==lang)await loadLang(j.user.lang)}
async function loadAll(){const[r,k]=await Promise.all([api('GET','/rooms'),api('GET','/tasks')]);S.rooms=r;S.tasks=k;S.msgs=await api('GET','/messages');
 if(can('admin','manager','reception'))S.bookings=await api('GET','/bookings');if(can('admin','manager'))S.users=await api('GET','/users')}
const can=(...r)=>r.includes(S.user?.role);
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws?t='+S.token);
 ws.onmessage=async e=>{const m=JSON.parse(e.data);try{
  if(m.type==='message'){S.msgs.push(m.data);if(S.view==='chat')renderChatMsgs();else if(m.data.user_id!==S.user.id)toast('💬 '+(m.data.system?'':m.data.name+': ')+(m.data.system?sysText(m.data):E(m.data.body)).slice(0,60))}
  else{if(m.type==='rooms')S.rooms=await api('GET','/rooms');if(m.type==='bookings'&&can('admin','manager','reception'))S.bookings=await api('GET','/bookings');if(m.type==='tasks')S.tasks=await api('GET','/tasks');if(m.type==='hotel'){await loadMe()}render()}}catch{}};
 ws.onclose=()=>{if(S.token)setTimeout(()=>S.token&&connect(),3000)}}
const sysText=m=>{try{const{key,params}=JSON.parse(m.body);return t(key,{...params,status:t('status.'+params.status)})}catch{return''}};
function render(v){if(v==='setup')return renderAuth(true);if(!S.user)return renderAuth(false);
 const nav=[['dashboard','▦'],['rooms','⌂'],...(can('admin','manager','reception')?[['bookings','▤']]:[]),['tasks','✓'],['chat','✉'],...(can('admin','manager')?[['team','☺']]:[]),['settings','⚙']];
 $('#app').innerHTML=`<nav><div class="logo">${E(S.hotel)}<small>HotelOS · ${t('by')}</small></div>${nav.map(([k,i])=>`<a class="${S.view===k?'on':''}" onclick="go('${k}')"><span>${i} ${t('nav.'+k)}</span></a>`).join('')}</nav><main id="main"></main>`;
 ({dashboard,rooms,bookings,tasks,chat,team,settings})[S.view]()}
const go=v=>{S.view=v;render()};
function renderAuth(setup){$('#app').innerHTML=`<div class="login"><div style="text-align:center;margin-bottom:14px"><div style="font-size:26px;font-weight:700;color:var(--ac)">HotelOS</div><div class="mu">${t('by')}</div></div><div class="card"><h3 style="margin:0">${setup?t('setup.title'):t('signin')}</h3>
 ${setup?`<input id="h" placeholder="${t('setup.hotel')}"><input id="n" placeholder="${t('setup.name')}">`:''}
 <input id="l" placeholder="${t('login')}" autocomplete="username"><input id="p" type="password" placeholder="${t('password')}${setup?' ('+t('setup.min')+')':''}" autocomplete="current-password">
 <button id="go">${setup?t('setup.btn'):t('signin')}</button>${LS()}</div></div>`;
 const sub=()=>run(async()=>{if(setup){await api('POST','/setup',{hotel:$('#h').value,name:$('#n').value,login:$('#l').value,password:$('#p').value});}
  const j=await api('POST','/login',{login:$('#l').value,password:$('#p').value});S.token=j.token;localStorage.tk=j.token;await loadMe();await loadAll();connect();S.view='dashboard';render()});
 $('#go').onclick=sub;$('#p').onkeydown=e=>e.key==='Enter'&&sub()}
const M=h=>$('#main').innerHTML=h;
function dashboard(){const c={};Object.keys(SC).forEach(s=>c[s]=S.rooms.filter(r=>r.status===s).length);const n=S.rooms.length||1,td=new Date().toISOString().slice(0,10);
 const arr=S.bookings.filter(b=>b.checkin===td&&b.state==='booked').length,dep=S.bookings.filter(b=>b.checkout===td&&b.state==='in').length;
 M(`<h2>${t('nav.dashboard')}</h2><div class="grid"><div class="card"><div class="mu">${t('dash.occupancy')}</div><div class="big">${Math.round(c.occupied/n*100)}%</div></div>
 ${can('admin','manager','reception')?`<div class="card"><div class="mu">${t('dash.arrivals')}</div><div class="big">${arr}</div></div><div class="card"><div class="mu">${t('dash.departures')}</div><div class="big">${dep}</div></div>`:''}
 <div class="card"><div class="mu">${t('dash.opentasks')}</div><div class="big">${S.tasks.filter(x=>!x.done).length}</div></div></div>
 <div class="card" style="margin-top:12px"><div class="mu" style="margin-bottom:8px">${t('dash.rooms')}</div><div class="bar">${Object.keys(SC).map(s=>`<i style="width:${c[s]/n*100}%;background:var(${SC[s]})"></i>`).join('')}</div>
 <div class="row" style="margin-top:12px">${Object.keys(SC).map(s=>`<div>${pill(s)} <b>${c[s]}</b></div>`).join('')}</div></div>`)}
function rooms(){const fl=[...new Set(S.rooms.map(r=>r.floor))],list=S.rooms.filter(r=>S.filter==='all'||String(r.floor)===S.filter),adm=can('admin','manager');
 M(`<h2>${t('nav.rooms')}</h2><div class="row"><select onchange="S.filter=this.value;rooms()"><option value="all">${t('all')}</option>${fl.map(f=>`<option value="${f}" ${S.filter==String(f)?'selected':''}>${t('floor')} ${f}</option>`).join('')}</select></div>
 ${adm?`<div class="card row"><input id="rn" placeholder="${t('room.number')}"><input id="rf" type="number" placeholder="${t('room.floor')}"><input id="rt" placeholder="${t('room.type')}"><input id="rb" type="number" placeholder="${t('room.beds')}"><input id="rp" type="number" placeholder="${t('room.price')}"><button onclick="addRoom()">${t('room.add')}</button></div>`:''}
 <div class="grid">${list.map(r=>`<div class="card" style="border-left:4px solid var(${SC[r.status]})"><div style="display:flex;justify-content:space-between"><b style="font-size:20px">${E(r.number)}</b>${pill(r.status)}</div>
 <div class="mu">${E(r.type)} · ${r.beds} ${t('room.beds').toLowerCase()} · ${money(r.price)}</div>
 <select onchange="setSt(${r.id},this.value)" style="margin-top:8px">${Object.keys(SC).map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${t('status.'+s)}</option>`).join('')}</select>
 ${can('admin')?`<button class="g" style="margin-top:8px" onclick="delRoom(${r.id})">${t('room.delete')}</button>`:''}</div>`).join('')||`<div class="mu">${t('room.none')}</div>`}</div>`)}
const setSt=(id,s)=>run(()=>api('PUT',`/rooms/${id}/status`,{status:s}));
const addRoom=()=>run(async()=>{await api('POST','/rooms',{number:$('#rn').value,floor:$('#rf').value,type:$('#rt').value,beds:$('#rb').value,price:$('#rp').value});S.rooms=await api('GET','/rooms');rooms()});
const delRoom=id=>confirm('?')&&run(()=>api('DELETE','/rooms/'+id));
function bookings(){M(`<h2>${t('nav.bookings')}</h2><div class="card row"><select id="br">${S.rooms.map(r=>`<option value="${r.id}">${t('b.room')} ${E(r.number)}</option>`).join('')}</select><input id="bg" placeholder="${t('b.guest')}"><input id="bp" placeholder="${t('b.phone')}"><input id="bi" type="date" title="${t('b.in')}"><input id="bo" type="date" title="${t('b.out')}"><input id="bn" placeholder="${t('b.note')}"><button onclick="addB()">${t('b.add')}</button></div>
 <div class="card" style="overflow:auto"><table><tr><th>${t('b.room')}</th><th>${t('b.guest')}</th><th>${t('b.in')}</th><th>${t('b.out')}</th><th></th></tr>${S.bookings.map(b=>`<tr><td>${E(b.room)}</td><td>${E(b.guest)}<div class="mu">${E(b.phone)}</div></td><td>${fmtD(b.checkin)}</td><td>${fmtD(b.checkout)}</td><td>${t('bstate.'+b.state)}<div class="row">
 ${b.state==='booked'?`<button onclick="bs(${b.id},'in')">${t('b.checkin')}</button><button class="g" onclick="bs(${b.id},'cancelled')">${t('b.cancel')}</button>`:''}${b.state==='in'?`<button onclick="bs(${b.id},'out')">${t('b.checkout')}</button>`:''}</div></td></tr>`).join('')||`<tr><td colspan=5 class="mu">${t('b.none')}</td></tr>`}</table></div>`)}
const addB=()=>run(async()=>{await api('POST','/bookings',{room_id:$('#br').value,guest:$('#bg').value,phone:$('#bp').value,checkin:$('#bi').value,checkout:$('#bo').value,note:$('#bn').value});S.bookings=await api('GET','/bookings');bookings()});
const bs=(id,s)=>run(()=>api('PUT',`/bookings/${id}/state`,{state:s}));
function tasks(){const staff=S.users;M(`<h2>${t('nav.tasks')}</h2>${can('admin','manager','reception')?`<div class="card row"><input id="tt" placeholder="${t('t.title')}"><select id="tr"><option value="">${t('t.room')}</option>${S.rooms.map(r=>`<option value="${r.id}">${E(r.number)}</option>`).join('')}</select>${staff.length?`<select id="ta"><option value="">${t('t.assignee')}</option>${staff.filter(u=>u.active).map(u=>`<option value="${u.id}">${E(u.name)}</option>`).join('')}</select>`:''}<button onclick="addT()">${t('t.add')}</button></div>`:''}
 <div class="grid">${S.tasks.map(x=>`<div class="card" style="${x.done?'opacity:.5':''}"><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" style="width:auto" ${x.done?'checked':''} onchange="tg(${x.id},this.checked)"><span>${E(x.title)}</span></label><div class="mu">${x.room?t('b.room')+' '+E(x.room):''} ${x.assignee_name?'· '+E(x.assignee_name):''}</div></div>`).join('')||`<div class="mu">${t('t.none')}</div>`}</div>`)}
const addT=()=>run(async()=>{await api('POST','/tasks',{title:$('#tt').value,room_id:$('#tr').value||null,assignee:$('#ta')?.value||null});S.tasks=await api('GET','/tasks');tasks()});
const tg=(id,d)=>run(()=>api('PUT','/tasks/'+id,{done:d}));
function chat(){M(`<h2>${t('nav.chat')}</h2><div class="card"><div id="chat"></div><div class="row"><input id="cm" placeholder="${t('chat.placeholder')}" onkeydown="event.key==='Enter'&&sendM()"><button onclick="sendM()">${t('chat.send')}</button></div></div>`);renderChatMsgs()}
function renderChatMsgs(){const c=$('#chat');if(!c)return;c.innerHTML=S.msgs.map(m=>m.system?`<div class="m s">${E(sysText(m))} · ${fmtT(m.ts)}</div>`:`<div class="m ${m.user_id===S.user.id?'me':''}"><div class="mu">${E(m.name)} · ${fmtT(m.ts)}</div>${E(m.body)}</div>`).join('');c.scrollTop=c.scrollHeight}
const sendM=()=>{const i=$('#cm');if(!i.value.trim())return;const b=i.value;i.value='';run(()=>api('POST','/messages',{body:b}))};
function team(){M(`<h2>${t('nav.team')}</h2>${can('admin')?`<div class="card row"><input id="un" placeholder="${t('u.name')}"><input id="ul" placeholder="${t('login')}"><input id="up" type="password" placeholder="${t('password')}"><select id="ur">${['manager','reception','housekeeping','admin'].map(r=>`<option value="${r}">${t('role.'+r)}</option>`).join('')}</select><button onclick="addU()">${t('u.add')}</button></div>`:''}
 <div class="card"><table>${S.users.map(u=>`<tr><td>${E(u.name)}<div class="mu">${E(u.login)}${u.active?'':' · '+t('u.inactive')}</div></td><td>${t('role.'+u.role)}</td><td>${can('admin')&&u.id!==S.user.id?`<button class="g" onclick="tu(${u.id},${u.active?0:1})">${u.active?t('u.disable'):t('u.enable')}</button>`:''}</td></tr>`).join('')}</table></div>`)}
const addU=()=>run(async()=>{await api('POST','/users',{name:$('#un').value,login:$('#ul').value,password:$('#up').value,role:$('#ur').value});S.users=await api('GET','/users');team()});
const tu=(id,a)=>run(async()=>{await api('PUT','/users/'+id,{active:a});S.users=await api('GET','/users');team()});
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
function settings(){M(`<h2>${t('nav.settings')}</h2><div class="grid"><div class="card" style="display:grid;gap:10px"><b>${t('set.profile')}</b><div class="mu">${E(S.user.name)} · ${t('role.'+S.user.role)}</div><label class="mu">${t('language')}</label>${LS()}
 <input id="np" type="password" placeholder="${t('set.newpass')}"><button onclick="cp()">${t('set.changepass')}</button>${dp?`<button class="g" onclick="dp.prompt()">${t('set.install')}</button>`:''}<button class="g" onclick="logout()">${t('signout')}</button></div>
 ${can('admin')?`<div class="card" style="display:grid;gap:10px"><b>${t('set.hotel')}</b><input id="hn" value="${E(S.hotel)}"><button onclick="sh()">${t('set.save')}</button></div>`:''}</div>`)}
const cp=()=>run(async()=>{await api('PUT','/me',{password:$('#np').value});$('#np').value='';toast(t('saved'))});
const sh=()=>run(async()=>{await api('PUT','/hotel',{name:$('#hn').value});toast(t('saved'))});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
boot().catch(e=>{$('#app').innerHTML='<div class="login"><div class="card"><h3 style="margin:0">HotelOS</h3><p>'+(location.protocol==='file:'?'Plik index.html nie działa po otwarciu z dysku. Uruchom serwer (<code>npm install</code> i <code>npm start</code>), a potem otwórz <b>http://localhost:3000</b>.':'Brak połączenia z serwerem. Upewnij się, że działa <code>npm start</code>.')+'</p><p class="mu">'+E(e.message)+'</p></div></div>'});
</script></body></html>
